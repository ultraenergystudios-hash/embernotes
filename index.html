<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ember</title>
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
  <aside id="side">
    <div class="brand"><span class="logo"></span>Ember</div>
    <nav id="nav"></nav>
    <div class="tags-h" id="tagsH">Tags</div>
    <nav id="tags"></nav>
    <div class="side-foot">
      <button class="navbtn" data-view="settings" id="settingsBtn"></button>
      <div class="hint" id="hotkeyHint"></div>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <label class="search" id="searchBox">
        <span id="searchIcon"></span>
        <input id="search" placeholder="Search" spellcheck="false">
        <kbd>/</kbd>
      </label>
    </header>

    <div class="add" id="addWrap">
      <div class="addrow">
        <span class="plus" id="plus"></span>
        <input id="add" autocomplete="off" spellcheck="false" placeholder="Add a task — try “Send deck to @Alex fri 14 #onboarding”">
        <kbd>N</kbd>
      </div>
      <div class="chips addprev" id="addPrev"></div>
    </div>

    <section id="list" tabindex="-1"></section>
    <section id="settings" hidden></section>
  </main>

  <div id="toast" hidden></div>
  <div id="help" hidden></div>

<script type="module" src="/src/bridge.js"></script>
<script type="module" src="/src/parse.js"></script>
<script type="module" src="/src/ui.js"></script>
<script type="module" src="/src/app.js"></script>
<script type="module" src="/src/updater.js"></script>
</body>
</html>
