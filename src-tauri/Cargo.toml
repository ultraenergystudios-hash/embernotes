[package]
name = "ember"
version = "0.2.0"
description = "Fast capture todo + reminders"
authors = ["Dennis"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed for transparent (rounded) capture/reminder windows on macOS
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Auto-update infrastructure. `updater` checks the GitHub Releases endpoint
# configured in tauri.conf.json; `process` lets the frontend ask the app
# to relaunch after applying an update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
